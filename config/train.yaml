model: weights/yolo26n.pt  
data: config/data.yaml         # 数据集配置（相对项目根）

# 基本项
imgsz: 1280                    # 小目标多，用 1280；快速冒烟测试可临时 --imgsz 640
epochs: 80
batch: 16                      # RTX 4090D 24GB
device: 0                      # GPU 编号
workers: 8
name: rm_car_full_v2           # 训练日志输出到 runs/rm_car_full_v2/ （将可选标注并入训练集后的第二次训练）

# 学习率 / 优化器 
optimizer: auto                # 自动选优化器：实际用 AdamW（lr≈0.002），会忽略 lr0
lrf: 0.01                      # 最终学习率因子（余弦退火终点 = 0.002 × lrf ≈ 0.00002）
cos_lr: true                   # 余弦退火
warmup_epochs: 3               # 前几轮线性 warmup

# 训练策略 
patience: 15                   # 早停：15 轮验证无提升则停
save_period: 5                 # 每 5 轮存一个检查点（另存 best.pt / last.pt）
close_mosaic: 10               # 最后 10 轮关闭 mosaic，收尾回到真实图分布
  