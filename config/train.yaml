# ============================================================
# 训练超参 —— src/train.py 会读取本文件
# 每改动一次，记录到训练表格（对应 docs/ 里的实验记录）
# ============================================================

model: weights/yolo26n.pt  # baseline 预训练权重（放在 weights/ 下）
data: config/data.yaml     # 数据集配置（相对项目根）
imgsz: 640                 # 起步用 640 作 baseline；小目标建议上调到 1280
epochs: 50
batch: 8
device: 0                  # AutoDL GPU 编号；CPU 用 "cpu"
workers: 8
name: rm_car               # 训练输出目录名（runs/rm_car/...）

# ---- 可调项（写进训练表格对比 mAP）----
# lr0: 0.01        # 初始学习率
# cos_lr: true     # 余弦退火
# mosaic: 1.0      # 小目标可试 0（关闭 mosaic）
# hsv_h: 0.015     # 数据增强
# patience: 50     # 早停
# close_mosaic: 10 # 最后 N 轮关闭 mosaic
