# ============================================================
# 数据集配置 —— 训练前按实际路径修改
# ============================================================
# path : datasets 根目录（相对本文件位置）
# train / val / test : 相对于 path 的图片目录
# 注意：YOLO 会根据 images 目录自动找同级 labels 目录
# ============================================================

path: ../datasets

train: images/train
val: images/val
test: images/test   # 可选，最终评测用组织方内部测试集

# 类别（nc 会自动从 names 长度推断）
names:
  0: robot   # TODO: 与组织方确认 class 0 到底是什么（车/机器人/装甲板）
